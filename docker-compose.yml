version: '3.8'

services:
  # 1. Laravel 應用程式服務 (PHP-FPM + Composer)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wms-oms-app:latest
    container_name: wms-oms-app
    restart: always
    volumes:
      # 掛載程式碼目錄
      - ./backend:/var/www/html
    # 執行隊列 Worker 和 Entrypoint
    entrypoint: sh /var/www/html/docker-entrypoint.sh

  # 2. 資料庫服務 (使用 PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: wms-oms-db
    restart: always
    environment:
      POSTGRES_DB: wms_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 3. Redis 佇列和快取服務
  redis:
    image: redis:alpine
    container_name: wms-oms-redis
    restart: always
    ports:
      - "6379:6379"

  # 4. Nginx Web 服務 (用於代理 PHP-FPM 和前端)
  nginx:
    image: nginx:stable-alpine
    container_name: wms-oms-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      # 假設前端在本地開發模式下運行 (npm run dev)，Nginx 僅代理 API

volumes:
  db_data:
